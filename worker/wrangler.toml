name = "space-weather-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "space-weather-dashboard"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
CORS_ORIGIN = "https://REPLACE_WITH_YOUR_PAGES_DOMAIN"
